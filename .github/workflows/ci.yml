name: Eyes on Glass CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-lint-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install system dependencies for OpenCV/FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg libsm6 libxext6 libgl1
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install flake8 pytest pytest-cov pytest-asyncio
    - name: Lint with flake8
      run: |
        cd backend
        flake8 app core db --count --max-line-length=100 --statistics
    - name: Test with pytest
      run: |
        cd backend
        PYTHONPATH=. pytest --cov=app --cov=core --cov=db tests/

  frontend-lint-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
    - name: Install dependencies
      run: |
        cd frontend
        npm ci
    - name: ESLint
      run: |
        cd frontend
        npm run lint
    - name: Run tests
      run: |
        cd frontend
        npm test

  swift-backend-test:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install system dependencies
      run: brew install ffmpeg
    - name: Build and Test
      run: |
        cd swift-backend
        swift test
