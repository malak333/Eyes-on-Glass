name: Eyes on Glass CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-lint-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install flake8 pytest pytest-cov pytest-asyncio
    - name: Lint with flake8
      run: |
        cd backend
        flake8 app core db --count --max-line-length=100 --statistics
    - name: Test with pytest
      run: |
        cd backend
        PYTHONPATH=. pytest --cov=app --cov=core --cov=db tests/

  frontend-lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
    - name: Install dependencies
      run: |
        cd frontend
        npm ci
    - name: ESLint
      run: |
        cd frontend
        npm run lint
